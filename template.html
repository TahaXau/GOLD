<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0906">
<title>Gold News Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#0b0906; --umber:#15100b; --umber2:#1c150e;
  --champagne:#ecd69c; --gold:#c9a24a; --goldDeep:#8f6c22;
  --ivory:#f4ecd8; --smoke:#9d927b; --line:rgba(201,162,74,.22);
  --garnet:#c4414a; --emerald:#52b788; --amber:#b9801f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:clamp(14px,3.2vw,36px);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--velvet);color:var(--ivory);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 50% -8%,rgba(201,162,74,.20),transparent 70%),
   radial-gradient(700px 500px at 100% 100%,rgba(143,108,34,.14),transparent 70%),
   var(--velvet)}
.w{max-width:1240px;margin:0 auto;padding:calc(var(--pad) * .8) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
h1{margin:0;font:600 clamp(26px,4.4vw,40px)/1.05 var(--serif);letter-spacing:.01em;
  background:linear-gradient(180deg,#fff3cf,var(--champagne) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--smoke);font-size:13px}

/* hero */
.hero{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:14px}
.holo{position:relative;height:300px;border:1px solid var(--line);border-radius:22px;overflow:hidden;touch-action:pan-y;cursor:grab;
  background:radial-gradient(60% 70% at 50% 62%,rgba(201,162,74,.16),transparent 70%),linear-gradient(180deg,var(--umber),var(--velvet))}
.holo:active{cursor:grabbing}
.holo canvas{display:block;width:100%;height:100%}
.holo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,235,180,.05) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.holo .hint{position:absolute;left:16px;bottom:12px;font:italic 500 15px var(--serif);color:var(--smoke);pointer-events:none;z-index:2}
.price{position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,3vw,34px);border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(160deg,var(--umber2),var(--umber) 60%,#100c08)}
.price::before{content:"Gold futures, US dollars per ounce";display:block;color:var(--smoke);font-size:14px;margin-bottom:6px}
.n{font:600 clamp(48px,9vw,92px)/1 var(--serif);letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff3cf,var(--champagne) 40%,var(--gold) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.up{color:var(--emerald)}.dn{color:var(--garnet)}.mut{color:var(--smoke)}
.price .up,.price .dn{font-size:18px;font-weight:600;margin-top:8px}
.tfs,.ch{display:none!important}

/* chart + news */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.tvbox{height:520px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--umber)}
.news h2{margin:2px 0 12px;font:600 26px/1.1 var(--serif);color:var(--champagne)}
.card{display:block;margin-bottom:10px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;text-decoration:none;color:inherit;
  background:linear-gradient(160deg,var(--umber2),var(--umber))}
.card:has(.HIGH){border-left-color:var(--garnet)}
.card:has(.MED){border-left-color:var(--amber)}
.card:has(.LOW){border-left-color:var(--smoke)}
.card:hover{border-color:rgba(236,214,156,.55)}
.card:focus-visible,.holo:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:99px;color:var(--ivory);margin-bottom:7px}
.HIGH{background:var(--garnet)}.MED{background:var(--amber)}.LOW{background:#5b5340}
h3{margin:0 0 8px;font:500 16px/1.4 var(--sans);color:var(--ivory)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--smoke)}
.imp{font-weight:600}
.warn{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--smoke);font-size:12.5px;max-width:80ch}

@media (min-width:900px){
  .hero{grid-template-columns:1.2fr 1fr}
  .holo{height:420px}
}
@media (min-width:1000px){
  .grid{grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);align-items:start}
  .tvbox{height:680px}
  .news{max-height:680px;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--goldDeep) transparent}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <header class="top">
    <h1>Gold News Radar</h1>
    <div class="sub">Updated <span id="upd"></span>. News refreshes every hour.</div>
  </header>

  <section class="hero">
    <div class="holo" id="holo" role="img" aria-label="Rotating 3D hologram of stacked gold bars"><div class="hint">Drag to turn the bars</div></div>
    <div class="price">__PRICE__</div>
  </section>

  <main class="grid">
    <div class="tvbox"><div id="tv_chart" style="height:100%"></div></div>
    <aside class="news">
      <h2>What is moving gold</h2>
      __CARDS__
    </aside>
  </main>

  <div class="warn">Not financial advice. The HIGH, MED and LOW tags and the bullish or bearish labels are assigned automatically from keywords and can be wrong. Read the full story before you trade.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
/* ---------- 3D gold hologram ---------- */
(function(){
  try{
    var el=document.getElementById("holo");
    if(!el||!window.THREE) return;
    var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var W=el.clientWidth,H=el.clientHeight;
    var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(W,H);
    el.insertBefore(renderer.domElement,el.firstChild);
    var scene=new THREE.Scene();
    var cam=new THREE.PerspectiveCamera(36,W/H,0.1,100);
    cam.position.set(0,1.5,9.2);cam.lookAt(0,-0.1,0);
    var group=new THREE.Group();scene.add(group);

    var GOLD=0xd9b25a, LIGHT=0xf6e2a6;
    function bar(x,y,z){
      var g=new THREE.BoxGeometry(2.2,0.72,1.05);
      var p=g.attributes.position;
      for(var i=0;i<p.count;i++){
        if(p.getY(i)>0){p.setX(i,p.getX(i)*0.84);p.setZ(i,p.getZ(i)*0.76);}
      }
      g.computeVertexNormals();
      var fill=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:0.17,blending:THREE.AdditiveBlending,depthWrite:false}));
      var edge=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:LIGHT,transparent:true,opacity:0.95}));
      var o=new THREE.Group();o.add(fill);o.add(edge);o.position.set(x,y,z);group.add(o);
    }
    bar(-1.2,-0.8,0);bar(1.2,-0.8,0);bar(0,-0.04,0);

    function ring(r1,r2,op){
      var m=new THREE.Mesh(new THREE.RingGeometry(r1,r2,96),new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:op,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
      m.rotation.x=-Math.PI/2;return m;
    }
    var base=ring(2.9,2.95,0.9);base.position.y=-1.45;scene.add(base);
    var base2=ring(3.5,3.53,0.35);base2.position.y=-1.45;scene.add(base2);
    var beam=new THREE.Mesh(new THREE.CylinderGeometry(2.9,2.9,3.4,64,1,true),new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:0.05,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    beam.position.y=0.25;scene.add(beam);
    var scan=ring(2.55,2.62,0.7);scene.add(scan);

    var N=150,pos=new Float32Array(N*3),spd=new Float32Array(N);
    for(var i=0;i<N;i++){
      var a=Math.random()*6.283,r=Math.random()*2.7;
      pos[i*3]=Math.cos(a)*r;pos[i*3+1]=-1.4+Math.random()*3.2;pos[i*3+2]=Math.sin(a)*r;
      spd[i]=0.004+Math.random()*0.008;
    }
    var pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
    var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:LIGHT,size:0.045,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(pts);

    var rotY=0.5,vel=0.0045,drag=false,lastX=0,t=0,visible=true;
    el.addEventListener("pointerdown",function(e){drag=true;lastX=e.clientX;});
    window.addEventListener("pointerup",function(){drag=false;});
    window.addEventListener("pointermove",function(e){
      if(!drag)return;rotY+=(e.clientX-lastX)*0.012;lastX=e.clientX;
    });

    function frame(){
      t+=0.016;
      if(!drag)rotY+=vel;
      group.rotation.y=rotY;
      group.position.y=Math.sin(t*1.1)*0.07;
      scan.position.y=-1.4+((t*0.45)%1)*3.1;
      scan.material.opacity=0.7*(1-((t*0.45)%1));
      var p=pg.attributes.position;
      for(var i=0;i<N;i++){
        var y=p.getY(i)+spd[i];if(y>1.8)y=-1.4;p.setY(i,y);
      }
      p.needsUpdate=true;
      renderer.render(scene,cam);
    }
    function loop(){if(visible)frame();requestAnimationFrame(loop);}
    if(reduce){frame();}else{loop();}

    if("IntersectionObserver" in window){
      new IntersectionObserver(function(en){visible=en[0].isIntersecting;}).observe(el);
    }
    function resize(){
      var w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;
      renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();if(reduce)frame();
    }
    window.addEventListener("resize",resize);
  }catch(e){}
})();

/* ---------- TradingView chart ---------- */
try{
  new TradingView.widget({
    autosize:true,
    symbol:"OANDA:XAUUSD",
    interval:"60",
    timezone:"Etc/UTC",
    theme:"dark",
    style:"1",
    locale:"en",
    toolbar_bg:"#15100b",
    backgroundColor:"#15100b",
    enable_publishing:false,
    allow_symbol_change:true,
    hide_side_toolbar:false,
    withdateranges:true,
    save_image:true,
    overrides:{"paneProperties.background":"#15100b","paneProperties.backgroundType":"solid"},
    container_id:"tv_chart"
  });
}catch(e){}

/* ---------- times ---------- */
function fmt(s){return new Date(s).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
document.getElementById("upd").textContent=fmt("__UPDATED__");
document.querySelectorAll(".t").forEach(function(e){e.textContent=fmt(e.dataset.ts)});
</script>
</body>
</html>
