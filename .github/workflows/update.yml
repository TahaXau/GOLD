name: Update gold news

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths: ["update.py", "template.html"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update gold news" && git push)
